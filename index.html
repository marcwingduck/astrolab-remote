<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1e1e1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Astrolab</title>
    <!--deploy.sh stamps BUILD with the version it uploads and puts the same into version.txt: a page
        the browser kept from an earlier version notices and loads the current one, once-->
    <script>
        (function (build) {
            if (build === 'BUILD' || location.search.indexOf('v=') >= 0) return;  // not deployed, or already reloaded
            fetch('version.txt?' + Date.now(), { cache: 'no-store' })
                .then(function (r) { return r.ok ? r.text() : build; })
                .then(function (v) { v = v.trim(); if (v && v !== build) location.replace(location.pathname + '?v=' + v); })
                .catch(function () { });
        })('BUILD');
    </script>
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <!--no svg favicon: firefox would take it for home screen shortcuts, being "any size"-->
    <link rel="icon" href="assets/favicon.png" sizes="32x32">
</head>

<body>

    <!--header-->
    <h1>Astrolab <span class="badge" id="status"></span></h1>
    <div class="error" id="error" hidden></div>

    <form>
        <div class="input-row">
            <input type="text" id="boardURL" value="ws://192.168.0.189:8266/">
            <input type="password" id="password" placeholder="Password">
        </div>
        <div class="input-row">
            <button class="btn" type="button" id="open">Open</button>
            <button class="btn" type="button" id="close">Close</button>
        </div>
    </form>

    <div class="mode-buttons">
        <button class="btn" type="button" id="btn-solunar">
            <svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12,7l2.66,2.66M12,7l-2.66,2.66" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <path d="M12,12.98v-5.98" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <path d="M3,16.76c2.48,0,4.34-2.25,4.34-2.25,0,0,1.87,2.25,4.35,2.25s4.97-2.25,4.97-2.25c0,0,2.48,2.25,4.34,2.25" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <path d="M2.25,20.44c2.48,0,5.09-1.5,5.09-1.5,0,0,1.87,1.5,4.35,1.5s4.97-1.5,4.97-1.5c0,0,3.23,1.5,5.09,1.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <path d="M5.27,12.44c-.17-.62-.27-1.27-.27-1.94,0-3.87,3.13-7,7-7s7,3.13,7,7c0,.67-.09,1.32-.27,1.94" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
            </svg>
        </button>
        <button class="btn" type="button" id="btn-radial" title="Radial glow in the selected side's color">
            <svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M12 13C12.5523 13 13 12.5523 13 12C13 11.4477 12.5523 11 12 11C11.4477 11 11 11.4477 11 12C11 12.5523 11.4477 13 12 13Z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M19 19L17.5 17.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M15.5 15.5L14.5 14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        </button>
        <button class="btn" type="button" id="btn-clock">
            <svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 6L12 12L18 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        </button>
        <button class="btn" type="button" id="btn-clock2">
            <svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 1.25C6.06294 1.25 1.25 6.06294 1.25 12C1.25 17.9371 6.06294 22.75 12 22.75C17.9371 22.75 22.75 17.9371 22.75 12C22.75 6.06294 17.9371 1.25 12 1.25ZM12.75 6C12.75 5.58579 12.4142 5.25 12 5.25C11.5858 5.25 11.25 5.58579 11.25 6L11.25 12C11.25 12.4142 11.5858 12.75 12 12.75H18C18.4142 12.75 18.75 12.4142 18.75 12C18.75 11.5858 18.4142 11.25 18 11.25H12.75L12.75 6Z" fill="currentColor"></path>
            </svg>
        </button>
        <button class="btn" type="button" id="btn-square">
            <svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 3.6V20.4C21 20.7314 20.7314 21 20.4 21H3.6C3.26863 21 3 20.7314 3 20.4V3.6C3 3.26863 3.26863 3 3.6 3H20.4C20.7314 3 21 3.26863 21 3.6Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        </button>
        <button class="btn" type="button" id="btn-circle">
            <svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        </button>
        <button class="btn" type="button" id="btn-vertical" title="From the north color at the top to the south color at the bottom">
            <svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20,7v-3H4v3" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <path d="M20,17v3H4v-3" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <path d="M12,17V7M12,17,12,17" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <path d="M12,7l2.66,2.66M12,7l-2.66,2.66" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <path d="M14.66,14.34l-2.66,2.66M9.34,14.34l2.66,2.66" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
            </svg>
        </button>
        <button class="btn" type="button" id="btn-halves" title="Top half in the north color, bottom half in the south color">
            <svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2,12h20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <path d="M20,7v-3H4v3" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <path d="M20,17v3H4v-3" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
            </svg>
        </button>
        <button class="btn" type="button" id="btn-larson">
            <svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <line x1="8.14" y1="14.65" x2="8.14" y2="14.05" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <line x1="10.71" y1="14.68" x2="10.71" y2="14.02" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <line x1="13.29" y1="15.17" x2="13.29" y2="13.53" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <line x1="15.86" y1="14.62" x2="15.86" y2="14.08" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <path d="M12,17.81c-2.38,0-9.09-.87-9.09-.87,0,0-.59-2.1-.66-2.59s1.37-4.31,1.61-4.63,1.09-.85,1.09-.85c0,0-.72-.34-.81-.37s.23-.58.32-.63,1.21-.08,1.21-.08c0,0,1.46-2.06,1.97-2.34s5.55-.26,4.36-.26,3.84-.03,4.36.26,1.97,2.34,1.97,2.34c0,0,1.13.04,1.21.08s.41.61.32.63-.81.37-.81.37c0,0,.85.53,1.09.85s1.69,4.14,1.61,4.63-.66,2.59-.66,2.59C21.09,16.94,14.38,17.81,12,17.81Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <path d="M4.95,8.87s4.8-.53,7.05-.53c2.25,0,7.05.53,7.05.53" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <path d="M13.28,10.42c.81.04,1.73.1,2.58.18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <line x1="2.25" y1="14.35" x2="5.25" y2="14.35" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <line x1="21.75" y1="14.35" x2="18.75" y2="14.35" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <path d="M2.25,14.35c.07.49.98,3.87.98,3.87,0,0,1.01.13,2.39.29l.22-1.21" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
                <path d="M21.75,14.35c-.07.49-.98,3.87-.98,3.87,0,0-1.01.13-2.39.29l-.22-1.21" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" />
            </svg>
        </button>
        <button class="btn" type="button" id="btn-spin">
            <svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M21.8883 13.5C21.1645 18.3113 17.013 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C16.1006 2 19.6248 4.46819 21.1679 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M17 8H21.4C21.7314 8 22 7.73137 22 7.4V3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        </button>
        <button class="btn" type="button" id="btn-focus">
            <svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6.87172 3.42759L4.23172 12.2276C4.11623 12.6126 4.4045 13 4.80642 13L19.1936 13C19.5955 13 19.8838 12.6126 19.7683 12.2276L17.1283 3.42759C17.0521 3.1738 16.8185 3 16.5536 3L7.44642 3C7.18145 3 6.94786 3.1738 6.87172 3.42759Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M8 15L8 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M8 21H16M12 15L12 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        </button>
        <button class="btn" type="button" id="btn-sleep">
            <svg width="24px" height="24px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 18H15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M10 21H14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M16.4999 11.5C17.4997 10.5 17.9765 9.48689 17.9999 8C18.0479 4.95029 16 3 11.9999 3C10.8324 3 9.83119 3.16613 8.99988 3.47724" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M8.99985 15C9 13 8.5 12.5 7.49985 11.5C6.4997 10.5 6.02324 9.48689 5.99985 8C5.99142 7.46458 6.0476 6.96304 6.1676 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M3 3L21 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
        </button>
    </div>

    <div class="slider-row">
        <label for="dimmer">Brightness</label>
        <input type="range" id="dimmer" min="0" max="1" step="0.02" value="0.5">
    </div>
    <!--hue of the selected sides (tap a side, or the map for all four); the gray start is no color-->
    <div class="slider-row">
        <label for="hue">Hue</label>
        <input type="range" id="hue" class="hue-slider" min="-20" max="360" step="1" value="-20">
    </div>
    <!--white led of the selected sides-->
    <div class="slider-row">
        <label for="white">White</label>
        <input type="range" id="white" class="white-slider" min="0" max="255" step="1" value="0">
    </div>

    <!--image and color controls-->
    <div class="map-grid">
        <!--north-->
        <div class="map-north">
            <div class="side-control" data-cardinal="north" data-axis="x">
                <div class="side-control-white"></div>
                <div class="side-control-color"></div>
                <input type="hidden" id="hnorth" value="180">
                <input type="hidden" id="wnorth" value="0">
            </div>
        </div>
        <!--west-->
        <div class="map-west">
            <div class="side-control" data-cardinal="west" data-axis="y">
                <div class="side-control-white"></div>
                <div class="side-control-color"></div>
                <input type="hidden" id="hwest" value="120">
                <input type="hidden" id="wwest" value="0">
            </div>
        </div>
        <!--image-->
        <div class="map-center">
            <img src="assets/paris.jpg" id="btn-all-color" style="cursor:pointer">
        </div>
        <!--east-->
        <div class="map-east">
            <div class="side-control" data-cardinal="east" data-axis="y">
                <div class="side-control-white"></div>
                <div class="side-control-color"></div>
                <input type="hidden" id="heast" value="60">
                <input type="hidden" id="weast" value="0">
            </div>
        </div>
        <!--south-->
        <div class="map-south">
            <div class="side-control" data-cardinal="south" data-axis="x">
                <div class="side-control-white"></div>
                <div class="side-control-color"></div>
                <input type="hidden" id="hsouth" value="300">
                <input type="hidden" id="wsouth" value="0">
            </div>
        </div>
    </div>

    <!--collapsible sections-->
    <div class="options-panel">

        <h2 class="toggle-header" id="toggle-dynamic">Parameters</h2>

        <div class="collapsible" id="collapseDynamic">
            <label class="option-row">
                <span class="option-label">Continuous</span>
                <input type="checkbox" id="clk_continuous" />
            </label>
            <label class="option-row">
                <span class="option-label">Start at Minute Hand</span>
                <input type="checkbox" id="clk_start_at_minute" checked />
            </label>
            <label class="option-row">
                <span class="option-label">Two Color Mode</span>
                <input type="checkbox" id="clk_two_colors" checked />
            </label>
            <label class="option-row">
                <span class="option-label">Ambient Mode</span>
                <input type="checkbox" id="clk_ambient" checked />
            </label>
            <div class="option-row">
                <span class="option-label">Spin frequency</span>
                <input type="number" id="frequency" min="0" step="0.1" value="0.25" />
                <span class="option-unit">Hz</span>
            </div>
        </div>

        <h2 class="toggle-header" id="toggle-tests">Tests</h2>

        <div class="collapsible" id="collapseTests">
            <div class="option-row">
                <button class="code-btn btn option-label" type="button">test_led({index})</button>
                <input type="number" id="index" min="0" max="179" step="1" value="0" />
            </div>
            <div class="option-row">
                <button class="code-btn btn option-label" type="button">cycle_channels()</button>
            </div>
            <div class="option-row">
                <button class="code-btn btn option-label" type="button">cycle_color({north})</button>
            </div>
            <div class="option-row">
                <button class="code-btn btn option-label" type="button">cycle_circular(10)</button>
            </div>
            <div class="option-row">
                <button class="code-btn btn option-label" type="button">solunar_demo()</button>
            </div>
            <div class="option-row">
                <button class="code-btn btn option-label" type="button">clock_demo()</button>
            </div>
        </div>

    </div>

    <script src="js/script.js"></script>
</body>

</html>
