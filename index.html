<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1e1e1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Paris Solar Map</title>
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/favicon.png">
</head>

<body>

    <!--header-->
    <h1>Celestial Map <span class="badge" id="status"></span></h1>

    <form>
        <div class="input-row">
            <input type="text" id="boardURL" value="ws://192.168.0.189:8266/">
            <input type="password" id="password" placeholder="Password">
        </div>
        <div class="input-row">
            <button class="btn" type="button" id="open">Open</button>
            <button class="btn" type="button" id="close">Close</button>
        </div>
    </form>

    <div class="mode-buttons">
            <button class="btn" type="button" id="btn-solunar">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M7.646 1.146a.5.5 0 0 1 .708 0l1.5 1.5a.5.5 0 0 1-.708.708L8.5 2.707V4.5a.5.5 0 0 1-1 0V2.707l-.646.647a.5.5 0 1 1-.708-.708l1.5-1.5zM2.343 4.343a.5.5 0 0 1 .707 0l1.414 1.414a.5.5 0 0 1-.707.707L2.343 5.05a.5.5 0 0 1 0-.707zm11.314 0a.5.5 0 0 1 0 .707l-1.414 1.414a.5.5 0 1 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zM11.709 11.5a4 4 0 1 0-7.418 0H.5a.5.5 0 0 0 0 1h15a.5.5 0 0 0 0-1h-3.79zM0 10a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2A.5.5 0 0 1 0 10zm13 0a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 0 1h-2a.5.5 0 0 1-.5-.5z" />
                </svg>
            </button>
            <button class="btn" type="button" id="btn-clock">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71V3.5z" />
                    <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16zm7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0z" />
                </svg>
            </button>
            <button class="btn" type="button" id="btn-clock2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71V3.5z" />
                </svg>
            </button>
            <button class="btn" type="button" id="btn-ambient">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M11.473 11a4.5 4.5 0 0 0-8.72-.99A3 3 0 0 0 3 16h8.5a2.5 2.5 0 0 0 0-5h-.027z" />
                    <path d="M11.286 1.778a.5.5 0 0 0-.565-.755 4.595 4.595 0 0 0-3.18 5.003 5.46 5.46 0 0 1 1.055.209A3.603 3.603 0 0 1 9.83 2.617a4.593 4.593 0 0 0 4.31 5.744 3.576 3.576 0 0 1-2.241.634c.162.317.295.652.394 1a4.59 4.59 0 0 0 3.624-2.04.5.5 0 0 0-.565-.755 3.593 3.593 0 0 1-4.065-5.422z" />
                </svg>
            </button>
            <button class="btn" type="button" id="btn-vertical">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M3.646 10.146a.5.5 0 0 1 .708 0L8 13.793l3.646-3.647a.5.5 0 0 1 .708.708l-4 4a.5.5 0 0 1-.708 0l-4-4a.5.5 0 0 1 0-.708zm0-4.292a.5.5 0 0 0 .708 0L8 2.207l3.646 3.647a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 0 0 0 .708zM1 8a.5.5 0 0 1 .5-.5h13a.5.5 0 0 1 0 1h-13A.5.5 0 0 1 1 8z" />
                </svg>
            </button>
            <button class="btn" type="button" id="btn-horizontal">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="m 5.854,3.646 a 0.5,0.5 0 0 1 0,0.708 L 2.207,8 5.854,11.646 a 0.5006316,0.5006316 0 0 1 -0.708,0.708 l -4,-4 a 0.5,0.5 0 0 1 0,-0.708 l 4,-4 a 0.5,0.5 0 0 1 0.708,0 z m 4.292,0 a 0.5,0.5 0 0 0 0,0.708 L 13.793,8 10.146,11.646 a 0.5006316,0.5006316 0 0 0 0.708,0.708 l 4,-4 a 0.5,0.5 0 0 0 0,-0.708 l -4,-4 a 0.5,0.5 0 0 0 -0.708,0 z M 8,1 a 0.5,0.5 0 0 1 0.5,0.5 v 13 a 0.5,0.5 0 0 1 -1,0 V 1.5 A 0.5,0.5 0 0 1 8,1 Z" />
                </svg>
            </button>
            <button class="btn" type="button" id="btn-circle">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z" />
                </svg>
            </button>
            <button class="btn" type="button" id="btn-square">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h12zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H2z" />
                </svg>
            </button>
            <button class="btn" type="button" id="btn-larson">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M2.52 3.515A2.5 2.5 0 0 1 4.82 2h6.362c1 0 1.904.596 2.298 1.515l.792 1.848c.075.175.21.319.38.404.5.25.855.715.965 1.262l.335 1.679c.033.161.049.325.049.49v.413c0 .814-.39 1.543-1 1.997V13.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-1.338c-1.292.048-2.745.088-4 .088s-2.708-.04-4-.088V13.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-1.892c-.61-.454-1-1.183-1-1.997v-.413a2.5 2.5 0 0 1 .049-.49l.335-1.68c.11-.546.465-1.012.964-1.261a.807.807 0 0 0 .381-.404l.792-1.848ZM3 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm10 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2ZM6 8a1 1 0 0 0 0 2h4a1 1 0 1 0 0-2H6ZM2.906 5.189a.51.51 0 0 0 .497.731c.91-.073 3.35-.17 4.597-.17 1.247 0 3.688.097 4.597.17a.51.51 0 0 0 .497-.731l-.956-1.913A.5.5 0 0 0 11.691 3H4.309a.5.5 0 0 0-.447.276L2.906 5.19Z" />
                </svg>
            </button>
            <button class="btn" type="button" id="btn-spin">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z" />
                    <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z" />
                </svg>
            </button>
            <button class="btn" type="button" id="btn-focus">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M5.04.303A.5.5 0 0 1 5.5 0h5c.2 0 .38.12.46.303l3 7a.5.5 0 0 1-.363.687h-.002c-.15.03-.3.056-.45.081a32.731 32.731 0 0 1-4.645.425V13.5a.5.5 0 1 1-1 0V8.495a32.753 32.753 0 0 1-4.645-.425c-.15-.025-.3-.05-.45-.08h-.003a.5.5 0 0 1-.362-.688l3-7Z" />
                    <path d="M6.493 12.574a.5.5 0 0 1-.411.575c-.712.118-1.28.295-1.655.493a1.319 1.319 0 0 0-.37.265.301.301 0 0 0-.052.075l-.001.004-.004.01V14l.002.008a.147.147 0 0 0 .016.033.62.62 0 0 0 .145.15c.165.13.435.27.813.395.751.25 1.82.414 3.024.414s2.273-.163 3.024-.414c.378-.126.648-.265.813-.395a.62.62 0 0 0 .146-.15.148.148 0 0 0 .015-.033L12 14v-.004a.301.301 0 0 0-.057-.09 1.318 1.318 0 0 0-.37-.264c-.376-.198-.943-.375-1.655-.493a.5.5 0 1 1 .164-.986c.77.127 1.452.328 1.957.594C12.5 13 13 13.4 13 14c0 .426-.26.752-.544.977-.29.228-.68.413-1.116.558-.878.293-2.059.465-3.34.465-1.281 0-2.462-.172-3.34-.465-.436-.145-.826-.33-1.116-.558C3.26 14.752 3 14.426 3 14c0-.599.5-1 .961-1.243.505-.266 1.187-.467 1.957-.594a.5.5 0 0 1 .575.411Z" />
                </svg>
            </button>
            <button class="btn" type="button" id="btn-sleep">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M2.23 4.35A6.004 6.004 0 0 0 2 6c0 1.691.7 3.22 1.826 4.31.203.196.359.4.453.619l.762 1.769A.5.5 0 0 0 5.5 13a.5.5 0 0 0 0 1 .5.5 0 0 0 0 1l.224.447a1 1 0 0 0 .894.553h2.764a1 1 0 0 0 .894-.553L10.5 15a.5.5 0 0 0 0-1 .5.5 0 0 0 0-1 .5.5 0 0 0 .288-.091L9.878 12H5.83l-.632-1.467a2.954 2.954 0 0 0-.676-.941 4.984 4.984 0 0 1-1.455-4.405l-.837-.836zm1.588-2.653.708.707a5 5 0 0 1 7.07 7.07l.707.707a6 6 0 0 0-8.484-8.484zm-2.172-.051a.5.5 0 0 1 .708 0l12 12a.5.5 0 0 1-.708.708l-12-12a.5.5 0 0 1 0-.708z" />
                </svg>
            </button>
        </div>

    <input type="range" id="dimmer" min="0" max="1" step="0.02" value="0.5">

    <!--image and color controls-->
    <div class="map-grid">
        <!--north-->
        <div class="map-north">
            <div class="side-control" data-cardinal="north" data-axis="x">
                <div class="side-control-white"></div>
                <div class="side-control-color"></div>
                <input type="color" id="rgbnorth" value="#00ffff">
                <input type="hidden" id="wnorth" value="0">
            </div>
        </div>
        <!--west-->
        <div class="map-west">
            <div class="side-control" data-cardinal="west" data-axis="y">
                <div class="side-control-white"></div>
                <div class="side-control-color"></div>
                <input type="color" id="rgbwest" value="#00ff00">
                <input type="hidden" id="wwest" value="0">
            </div>
        </div>
        <!--image-->
        <div class="map-center">
            <img src="assets/paris.jpg" id="btn-all-color" style="cursor:pointer">
            <input type="color" id="rgball" value="#ffffff" style="position:absolute;opacity:0;pointer-events:none;width:0;height:0">
        </div>
        <!--east-->
        <div class="map-east">
            <div class="side-control" data-cardinal="east" data-axis="y">
                <div class="side-control-white"></div>
                <div class="side-control-color"></div>
                <input type="color" id="rgbeast" value="#ffff00">
                <input type="hidden" id="weast" value="0">
            </div>
        </div>
        <!--south-->
        <div class="map-south">
            <div class="side-control" data-cardinal="south" data-axis="x">
                <div class="side-control-white"></div>
                <div class="side-control-color"></div>
                <input type="color" id="rgbsouth" value="#ff00ff">
                <input type="hidden" id="wsouth" value="0">
            </div>
        </div>
    </div>

    <!--collapsible sections-->
    <div class="options-panel">

        <h2 class="toggle-header" id="toggle-dynamic">Parameters</h2>

        <div class="collapsible" id="collapseDynamic">
            <label class="option-row">
                <span class="option-label">Continuous</span>
                <input type="checkbox" id="clk_continuous" />
            </label>
            <label class="option-row">
                <span class="option-label">Start at Minute Hand</span>
                <input type="checkbox" id="clk_start_at_minute" checked />
            </label>
            <label class="option-row">
                <span class="option-label">Two Color Mode</span>
                <input type="checkbox" id="clk_two_colors" checked />
            </label>
            <label class="option-row">
                <span class="option-label">Ambient Mode</span>
                <input type="checkbox" id="clk_ambient" checked />
            </label>
            <div class="option-row">
                <span class="option-label">Spin frequency</span>
                <input type="number" id="frequency" min="0" step="0.1" value="0.25" />
                <span class="option-unit">Hz</span>
            </div>
        </div>

        <h2 class="toggle-header" id="toggle-tests">Tests</h2>

        <div class="collapsible" id="collapseTests">
            <div class="option-row">
                <button class="code-btn btn option-label" type="button">test_led({index})</button>
                <input type="number" id="index" min="0" max="179" step="1" value="0" />
            </div>
            <div class="option-row">
                <button class="code-btn btn option-label" type="button">cycle_channels()</button>
            </div>
            <div class="option-row">
                <button class="code-btn btn option-label" type="button">cycle_color({north})</button>
            </div>
            <div class="option-row">
                <button class="code-btn btn option-label" type="button">cycle_circular(10)</button>
            </div>
            <div class="option-row">
                <button class="code-btn btn option-label" type="button">solunar_demo()</button>
            </div>
            <div class="option-row">
                <button class="code-btn btn option-label" type="button">clock_demo()</button>
            </div>
        </div>

    </div>
</body>

<script src="js/script.js"></script>

</html>
